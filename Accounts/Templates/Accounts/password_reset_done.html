<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <title>Anex | Password Reset Done</title>
  <link rel="shortcut icon" type="image/x-icon" href="{% static 'Users/Login/images/favicon-16x16.png' %}"/>
  <link rel="stylesheet" href="{% static 'Users/Login/css/login6-style.css' %}">
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-xs-12 col-sm-7 col-md-5 col-lg-4 authfy-panel-left">
        <!-- brand-logo start -->
        <div class="brand-logo text-center">
          <img src="{% static 'Users/Login/images/logo.png' %}" width="150" alt="brand-logo">
        </div><!-- ./brand-logo -->

        <!-- authfy-login start -->
        <div class="authfy-login">
          <!-- panel-forgot start -->
          <div class="">
            <div class="row">
              <div class="col-xs-12 col-sm-12">
                <div class="authfy-heading">
                  <h3 class="auth-title">Check Your Email</h3>
                  <p>If an account with the entered email exists, a password reset link has been sent to it.</p>
                  <p>Please check your inbox and follow the instructions to reset your password.</p>
                </div>

                <div class="form-group">
                  <a  href="{% url 'Accounts:login' %}">Login</a>
                </div>
              </div>
            </div>
          </div> <!-- ./panel-forgot -->
        </div> <!-- ./authfy-login -->
      </div> <!-- ./authfy-panel-left -->

      <div class="col-md-7 col-lg-8 authfy-panel-right hidden-xs hidden-sm">
        <div class="hero-heading">
          <div class="headline">
            <h3>Password Reset Done</h3>
            <p>Aura Intranet Portal</p>
          </div>
        </div>
      </div>
    </div> <!-- ./row -->
  </div> <!-- ./container -->

  <!-- Javascript Files -->
  <script src="{% static 'Users/Login/js/jquery-2.2.4.min.js' %}"></script>
  <script src="{% static 'Users/Login/js/bootstrap.min.js' %}"></script>
  <script src="{% static 'Users/Login/js/custom.js' %}"></script>

  <script>
    window.addEventListener("beforeunload", function () {
        navigator.sendBeacon("/logout/");
    });
  </script>
</body>
</html>
