{% load static %}
{% include 'Layout_Master/base.html' %}

<main class="grow pt-5" id="content" role="content">
  <div class="kt-container-fixed" id="contentContainer"></div>

  <!-- Login Modal -->
  <div class="kt-modal kt-modal-center" data-kt-modal="true" id="modal_welcome_message">
    <div class="kt-modal-content max-w-[500px] w-full">
      
      <!-- Modal Header -->
      <div class="kt-modal-header justify-end border-0 pt-5">
        <button class="kt-btn kt-btn-sm kt-btn-icon kt-btn-outline" data-kt-modal-dismiss="true">
          <i class="ki-filled ki-cross"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="kt-modal-body flex flex-col items-center pt-0 pb-10">
        <div class="kt-card max-w-[370px] w-full">

          <!-- Password Change Form -->
          <form method="post" class="kt-card-content flex flex-col gap-5 p-10">
            {% csrf_token %}
            <h3 class="text-lg font-medium text-mono text-center mb-3">Reset Password</h3>
            <div class="text-sm text-center text-secondary-foreground mb-7">
              You can change your password using your current password here.
            </div>

            <div class="flex flex-col gap-1">
              <label class="kt-form-label font-normal text-mono">Old Password</label>
              <input class="kt-input" placeholder="Old Password" name="old_password" required type="password">
            </div>

            <div class="flex flex-col gap-2">
              <label class="kt-form-label font-normal text-mono">New Password</label>
              <input class="kt-input" placeholder="New Password" name="new_password1" required type="password">
            </div>

            <div class="flex flex-col gap-2">
              <label class="kt-form-label font-normal text-mono">Confirm New Password</label>
              <input class="kt-input" placeholder="Confirm New Password" name="new_password2" required type="password">
            </div>

            <button type="submit" class="kt-btn kt-btn-primary flex justify-center grow">Change Password</button>
          </form>

        </div>
      </div>
    </div>
  </div>

  <script>
    window.onload = () => {
      const modalEl = document.querySelector('#modal_welcome_message');
      const modal = KTModal.getInstance(modalEl);
      modal?.show();
    };
  </script>
</main>
