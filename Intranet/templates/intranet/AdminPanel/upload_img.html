{% load static %}
{% include 'Layout_Master/base.html' %}

<link rel="stylesheet" href="{% static 'Gallery/assets/css/style1.css' %}">
<div class="kt-wrapper flex grow flex-col">
  <main class="grow pt-0" id="content" role="main">
    <div class="kt-container-fixed mt-4">
<link rel="stylesheet" href="{% static 'Gallery/assets/css/upload_img_css.css' %}">

<div class="container mt-5">
    <h2 class="mb-4">Upload Festival Images</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="p-4 bg-white shadow-sm rounded">
        {% csrf_token %}

        <!-- Festival Group -->
        <div class="mb-3">
            <label class="form-label fw-bold">Select Festival Group</label>
            <select name="group" class="form-select" required>
                <option value="">-- Select Group --</option>
                {% for g in groups %}
                    <option value="{{ g.id }}">{{ g.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Title -->
        <div class="mb-3">
            <label class="form-label fw-bold">Title (Optional)</label>
            <input type="text" name="title" class="form-control" placeholder="e.g. Office Christmas 2024">
            <div class="form-text">If blank, file name will be used as the title.</div>
        </div>

        <!-- Description -->
        <div class="mb-3">
            <label class="form-label fw-bold">Description (Optional)</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Enter a short description..."></textarea>
        </div>

        <!-- Multiple Image Upload -->
        <div class="mb-3">
            <label class="form-label fw-bold">Select Images</label>
            <input type="file" name="images" class="form-control" multiple accept="image/*" required>
            <div class="form-text">You can select multiple images (JPG, PNG, GIF).</div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary px-4">Upload</button>
    </form>
</div>
    <table class="kt-table table-fixed w-full mt-4" data-kt-datatable-table="true"></table>
  </main>
</div>
