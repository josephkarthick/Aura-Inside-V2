
{% load static %}
{% include 'Layout_Master/base.html' %}

<script src="{% static 'assets/js/org_chart.js' %}"></script>

<style>
    /* ===== Organization Chart Page ===== */
    .org-page {
        padding: 20px 24px 28px;
        max-width: 100%;
        min-width: 0;
    }

    .org-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 22px;
    }

    .org-title {
        margin: 0;
        color: #172554;
        font-size: 25px;
        font-weight: 750;
        letter-spacing: -0.5px;
    }

    .org-subtitle {
        margin-top: 5px;
        color: #64748b;
        font-size: 13px;
    }

    .org-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 13px;
        border: 1px solid #dbeafe;
        border-radius: 999px;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 12px;
        font-weight: 600;
    }

    .org-status-dot {
        width: 8px;
        height: 8px;
        background: #22c55e;
        border-radius: 50%;
    }

    /* ===== Tabs ===== */
    .org-tabs {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        padding: 6px;
        margin-bottom: 16px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #f8fafc;
    }

    .org-tabs .tab-btn {
        position: relative;
        padding: 11px 19px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: #64748b;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background .2s ease, color .2s ease,
                    box-shadow .2s ease;
    }

    .org-tabs .tab-btn:hover {
        color: #1d4ed8;
        background: #eff6ff;
    }

    .org-tabs .tab-btn.active {
        color: #1d4ed8;
        border-color: #dbeafe;
        background: #ffffff;
        box-shadow: 0 1px 3px rgba(15, 23, 42, .07);
    }

    /* ===== Chart Panel ===== */
    .org-panel {
        overflow: hidden;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 4px 18px rgba(15, 23, 42, .045);
    }

    .org-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 15px 19px;
        border-bottom: 1px solid #eef2f7;
        background: #ffffff;
    }

    .org-panel-title {
        margin: 0;
        color: #1e293b;
        font-size: 14px;
        font-weight: 700;
    }

    .org-panel-hint {
        margin-top: 4px;
        color: #94a3b8;
        font-size: 12px;
    }

    .org-panel-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .org-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 12px;
        border: 1px solid #dbe3ef;
        border-radius: 8px;
        background: #ffffff;
        color: #334155;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all .2s ease;
    }

    .org-action:hover {
        border-color: #93c5fd;
        background: #eff6ff;
        color: #1d4ed8;
    }

    .org-chart-viewport {
        position: relative;
        width: 100%;
        height: 72vh;
        min-height: 500px;
        max-height: 900px;
        overflow: hidden;
        background-color: #ffffff;
        background-image: radial-gradient(#dbe4f0 0.8px, transparent 0.8px);
        background-size: 20px 20px;
    }

    .org-chart-canvas {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
    }

    .org-chart-canvas > div,
    .org-chart-canvas canvas,
    .org-chart-canvas svg {
        max-width: 100%;
    }

    .org-empty {
        padding: 40px 20px;
        text-align: center;
        color: #64748b;
        font-size: 14px;
    }



    @media (max-width: 768px) {
        .org-page {
            padding: 14px 10px 20px;
        }

        .org-title {
            font-size: 21px;
        }

        .org-tabs {
            gap: 4px;
        }

        .org-tabs .tab-btn {
            flex: 1;
            padding: 10px 8px;
            font-size: 12px;
        }

        .org-panel-header {
            align-items: flex-start;
            padding: 13px;
        }

        .org-chart-viewport {
            height: 68vh;
            min-height: 420px;
        }
    }

    @media print {
        .org-tabs,
        .org-panel-actions,
        .org-status {
            display: none !important;
        }

        .org-chart-viewport {
            height: auto;
            min-height: 500px;
            max-height: none;
        }

        .org-panel {
            box-shadow: none;
        }
    }
</style>

<div class="kt-wrapper flex grow flex-col">
    <main class="grow pt-0" id="content" role="main">
    <table class="kt-table table-fixed w-full mt-4" data-kt-datatable-table="true"></table> 
        <div class="kt-container-fixed org-page">

            <!-- Page Header -->
            <div class="org-header">
                <div>
                    <h1 class="org-title">Organization Structure</h1>
                    <p class="org-subtitle">
                        Aura Inside · Organizational hierarchy
                    </p>
                </div>

                <div class="org-status">
                    <span class="org-status-dot"></span>
                    Organization Overview
                </div>
            </div>

            <!-- Chart Tabs -->
            <div class="org-tabs" role="tablist"
                 aria-label="Organization chart types">

                <button type="button"
                        onclick="switchTab('managementTab')"
                        id="tabManagement"
                        class="tab-btn active"
                        role="tab"
                        aria-selected="true"
                        aria-controls="managementTab">
                    Management Chart
                </button>

                <button type="button"
                        onclick="switchTab('currentTab')"
                        id="tabCurrent"
                        class="tab-btn"
                        role="tab"
                        aria-selected="false"
                        aria-controls="currentTab">
                    Operation Chart
                </button>
            </div>

            <!-- Management Chart -->
            <section id="managementTab"
                     class="tab-content"
                     role="tabpanel"
                     aria-labelledby="tabManagement">

                <div class="org-panel">
                    <div class="org-panel-header">
                        <div>
                            <h2 class="org-panel-title">
                                Management Hierarchy
                            </h2>

                        </div>

                        <div class="org-panel-actions">
                            <button type="button"
                                    class="org-action"
                                    onclick="refreshActiveChart()">
                                ↻ Refresh
                            </button>

                            <button type="button"
                                    class="org-action"
                                    onclick="toggleFullscreen('managementTab')">
                                ⛶ Fullscreen
                            </button>
                        </div>
                    </div>

                    <div class="org-chart-viewport" id="managementViewport">
                        <div id="managementChart"
                             class="org-chart-canvas"></div>
                    </div>
                </div>
            </section>

            <!-- Operation Chart -->
            <section id="currentTab"
                     class="tab-content hidden"
                     role="tabpanel"
                     aria-labelledby="tabCurrent">

                <div class="org-panel">
                    <div class="org-panel-header">
                        <div>
                            <h2 class="org-panel-title">
                                Operation Hierarchy
                            </h2>

                        </div>

                        <div class="org-panel-actions">
                            <button type="button"
                                    class="org-action"
                                    onclick="refreshActiveChart()">
                                ↻ Refresh
                            </button>

                            <button type="button"
                                    class="org-action"
                                    onclick="toggleFullscreen('currentTab')">
                                ⛶ Fullscreen
                            </button>
                        </div>
                    </div>

                    <div class="org-chart-viewport" id="currentViewport">
                        <div id="orgChart"
                             class="org-chart-canvas"></div>
                    </div>
                </div>
            </section>

        </div>
    </main>
</div>

<script>
(function () {
    "use strict";

    // Django must provide arrays of points for both charts.
    const rawOperationData = {{ org_data|default:"[]"|safe }};
    const rawManagementData = {{ management_data|default:"[]"|safe }};

    let operationChart = null;
    let managementChart = null;
    let activeTab = "managementTab";
    let resizeTimer = null;

    function normalizeData(source, chartName) {
        if (!Array.isArray(source)) {
            console.error(chartName + " data is not an array:", source);
            return [];
        }

        return source.filter(function (item) {
            return item && item.id !== undefined && item.id !== null &&
                   item.x !== undefined && item.x !== null;
        }).map(function (item) {
            const point = {
                id: String(item.id),
                // JSCharting organizational points use x as their displayed value.
                x: String(item.x),
                label: {
                    text:
                        (item.attributes && item.attributes.photo ?
                            String(item.attributes.photo) + "<br>" : "") +
                        "<b>" + String(item.x) + "</b><br>" +
                        '<span style="color:gray">' +
                        (item.attributes && item.attributes.role ?
                            String(item.attributes.role) : "") +
                        "</span>"
                }
            };

            if (item.parent !== undefined && item.parent !== null &&
                String(item.parent).trim() !== "") {
                point.parent = String(item.parent);
            }

            if (item.attributes && typeof item.attributes === "object") {
                point.attributes = item.attributes;
            }
            return point;
        });
    }

    const operationPoints = normalizeData(rawOperationData, "Operation chart");
    const managementPoints = normalizeData(rawManagementData, "Management chart");

    function showChartMessage(container, message, isError) {
        if (!container) return;
        container.innerHTML = "";
        const messageBox = document.createElement("div");
        messageBox.className = "org-empty";
        messageBox.style.padding = "40px 20px";
        messageBox.style.color = isError ? "#b91c1c" : "#64748b";
        messageBox.textContent = message;
        container.appendChild(messageBox);
    }

    function getChartOptions(points) {
        return {
            type: "organizational",
            defaultSeries: {
                color: "#ffffff",
                defaultPoint: {
                    tooltip: { enabled: false },
                    label: {
                        style: {
                            fontSize: "12px",
                            color: "#334155",
                            textAlign: "center"
                        }
                    },
                    outline: { color: "#d5deea", width: 1 },
                    connectorLine: { color: "#b8c6d8", radius: [6, 3] }
                }
            },
            navigation: {
                enabled: true,
                mouseWheelZoom: true,
                pan: true
            },
            toolbar: { visible: true },
            series: [{ points: points }]
        };
    }

    function resizeChart(chart) {
        if (chart && typeof chart.resize === "function") {
            chart.resize();
        }
    }

    function initializeChart(tabId) {
        const isManagement = tabId === "managementTab";
        const chartId = isManagement ? "managementChart" : "orgChart";
        const container = document.getElementById(chartId);
        const points = isManagement ? managementPoints : operationPoints;
        const existingChart = isManagement ? managementChart : operationChart;

        if (!container || container.clientWidth <= 0 || container.clientHeight <= 0) {
            return;
        }

        if (typeof window.JSC === "undefined" ||
            typeof window.JSC.chart !== "function") {
            showChartMessage(
                container,
                "Chart library did not load. Check the org_chart.js file and its Network response.",
                true
            );
            console.error("JSCharting is unavailable. Check assets/js/org_chart.js.");
            return;
        }

        if (!points.length) {
            showChartMessage(
                container,
                isManagement
                    ? "No management hierarchy data was returned by Django."
                    : "No operation hierarchy data was returned by Django.",
                false
            );
            console.warn(isManagement ? "management_data is empty or invalid." : "org_data is empty or invalid.");
            return;
        }

        if (existingChart) {
            resizeChart(existingChart);
            return;
        }

        try {
            const chart = window.JSC.chart(chartId, getChartOptions(points));
            if (isManagement) {
                managementChart = chart;
            } else {
                operationChart = chart;
            }

            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    resizeChart(chart);
                });
            });
        } catch (error) {
            console.error("Unable to render " + (isManagement ? "management" : "operation") + " chart:", error);
            showChartMessage(container, "The organization chart could not be rendered. Check the browser Console for details.", true);
        }
    }

    window.switchTab = function (tabId) {
        if (tabId !== "managementTab" && tabId !== "currentTab") return;
        activeTab = tabId;

        document.querySelectorAll(".tab-content").forEach(function (element) {
            element.classList.add("hidden");
        });
        document.querySelectorAll(".org-tabs .tab-btn").forEach(function (button) {
            button.classList.remove("active");
            button.setAttribute("aria-selected", "false");
        });

        const selectedTab = document.getElementById(tabId);
        const selectedButton = document.getElementById(
            tabId === "managementTab" ? "tabManagement" : "tabCurrent"
        );

        if (selectedTab) selectedTab.classList.remove("hidden");
        if (selectedButton) {
            selectedButton.classList.add("active");
            selectedButton.setAttribute("aria-selected", "true");
        }

        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                initializeChart(tabId);
            });
        });
    };

    window.refreshActiveChart = function () {
        const chart = activeTab === "managementTab" ? managementChart : operationChart;
        if (chart) {
            resizeChart(chart);
        } else {
            initializeChart(activeTab);
        }
    };

    window.toggleFullscreen = async function (tabId) {
        const panel = document.querySelector("#" + tabId + " .org-panel");
        if (!panel) return;
        try {
            if (!document.fullscreenElement) {
                await panel.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        } catch (error) {
            console.error("Fullscreen could not be enabled:", error);
        }
    };

    window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
            resizeChart(activeTab === "managementTab" ? managementChart : operationChart);
        }, 150);
    });

    document.addEventListener("fullscreenchange", function () {
        setTimeout(function () {
            resizeChart(activeTab === "managementTab" ? managementChart : operationChart);
        }, 150);
    });

    function startOrganizationChart() {
        console.info("Organization chart data counts:", {
            management: managementPoints.length,
            operation: operationPoints.length
        });
        window.switchTab("managementTab");
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startOrganizationChart, { once: true });
    } else {
        startOrganizationChart();
    }
})();
</script>

<script src="{% static 'metronic/tailwind/dist/assets/vendors/apexcharts/apexcharts.min.js' %}"></script>
<script src="{% static 'metronic/tailwind/dist/assets/js/layouts/demo1.js' %}"></script>
