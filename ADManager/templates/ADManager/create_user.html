{% load static %}
{% include 'Layout_Master/base.html' %}

<div class="row clearfix h-100">
  <div class="col-lg-12 h-100">
    <div class="card h-100">
      <div class="chat_app d-flex flex-column h-100">
        <div class="chat w-100 h-100 d-flex flex-column">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h6 class="card-title">Create New AD User</h6>
            <!-- No modal trigger now -->
          </div>

          <!-- ✅ Inline Add User Form -->
          <div class="card-body">
            <form method="post" action="">
              {% csrf_token %}
              <div class="row g-3 mb-3">
                <div class="col-md-3">
                  <input type="text" class="form-control" name="username" placeholder="Username" required>
                </div>
                <div class="col-md-3">
                  <input type="password" class="form-control" name="password" placeholder="Password" required
                         pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$"
                         title="Password must be at least 8 characters, include 1 uppercase letter, 1 number, and 1 special character.">
                                  
                </div>
                <div class="col-md-3">
                  <input type="text" class="form-control" name="first_name" placeholder="First Name" required>
                </div>
                <div class="col-md-3">
                  <input type="text" class="form-control" name="last_name" placeholder="Last Name" required>
                </div>
                <div class="col-md-4">
                  <select name="ou_dn" class="form-control" required>
                    <option value="">-- Select Organizational Unit --</option>
                    {% for ou_name, ou_dn in ous %}
                      <option value="{{ ou_dn }}">{{ ou_name }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="col-md-2">
                  <button type="submit" class="btn btn-success w-100">➕ Add User</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const passwordField = document.querySelector('input[name="password"]');

    passwordField.addEventListener('input', function () {
      const value = this.value;
      const isValid = /^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(value);

      if (!isValid) {
        this.setCustomValidity("Password must be at least 8 characters, include 1 uppercase letter, 1 number, and 1 special character.");
      } else {
        this.setCustomValidity("");
      }
    });
  });
</script>


<!-- Scripts -->
<script src="{% static 'assets/bundles/libscripts.bundle.js' %}"></script>
<script src="{% static 'assets/bundles/vendorscripts.bundle.js' %}"></script>
