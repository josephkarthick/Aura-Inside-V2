{% load static %}
{% include 'Layout_Master/base.html' %}

<div class="kt-wrapper flex grow flex-col">
  <main class="grow pt-5" id="content" role="main">

    <!-- Page Header -->
    <div class="kt-container-fixed">
      <div class="flex flex-wrap items-center justify-between gap-5 pb-7.5">
        <div>
          <h1 class="text-xl font-medium text-mono">Create Book</h1>
          <p class="text-sm text-secondary-foreground">Add book details and pages</p>
        </div>
      </div>
    </div>

    <!-- Main Card -->
    <div class="kt-container-fixed">
      <div class="kt-card w-full max-w-[900px] p-6 border rounded-xl bg-white shadow">

        <form method="post"
              action="{% url 'aura_books:create_book' %}"
              enctype="multipart/form-data">
          {% csrf_token %}

          <div class="grid gap-6">

          
			<!-- Book Meta - Single Row -->
			<div class="book-meta-grid">
			
				<div>
					<label class="font-semibold block mb-2">Title</label>
					<input name="title"
						class="kt-input w-full"
						placeholder="Enter book title"
						required>
				</div>
			
				<div>
					<label class="font-semibold block mb-2">Author</label>
					<input name="author"
						class="kt-input w-full"
						placeholder="Enter author name">
				</div>
			
				<div>
					<label class="font-semibold block mb-2">Year</label>
					<input name="year"
						type="number"
						class="kt-input w-full"
						placeholder="2026"
						required>
				</div>
			
			</div>

            <!-- Covers -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="font-semibold">Front Cover</label>
                <input type="file" name="front_cover_image" class="kt-input">
              </div>
              <div>
                <label class="font-semibold">Back Cover</label>
                <input type="file" name="back_cover_image" class="kt-input">
              </div>
            </div>

            <!-- Pages -->
            <h3 class="font-semibold text-lg">Start Your Page</h3>

            <div id="pagesContainer">

              <!-- First Page -->
              <div class="page-wrapper border p-4 rounded-lg mb-6">
                <h4 class="font-semibold mb-3">Page #1</h4>

                <input type="hidden" name="page_order[]" value="1">

                <div class="mb-3">
                  <label class="font-semibold">Heading</label>
                  <input name="heading[]" class="kt-input">
                </div>

                <div class="flex flex-col">
                  <label class="font-semibold">Paragraph</label>
                  <textarea class="page-editor"
                            name="paragraph[]"></textarea>
                </div>
              </div>

            </div>

            <!-- Add Page Button -->
            <button type="button"
                    class="kt-btn kt-btn-secondary"
                    id="addPageBtn">
              + Add Another Page
            </button>

            <!-- Footer -->
            <div class="flex justify-end gap-3 mt-6">
              <button type="submit"
                      class="kt-btn kt-btn-primary">
                Save Book
              </button>
              <a href="{% url 'aura_books:book_list' %}"
                 class="kt-btn kt-btn-secondary">
                Cancel
              </a>
            </div>

          </div>
        </form>

      </div>
    </div>
<table class="kt-table table-fixed kt-table-border w-full" data-kt-datatable-table="true"></table>
  </main>
</div>

<!-- ================= EDITOR CSS FIX ================= -->
<style>
/* Fix Tailwind/KT reset removing bullets */
.trumbowyg-editor ul {
    list-style-type: disc !important;
    padding-left: 20px !important;
    margin-left: 10px;
}

.trumbowyg-editor ol {
    list-style-type: decimal !important;
    padding-left: 20px !important;
    margin-left: 10px;
}

.trumbowyg-editor li {
    margin-bottom: 5px;
}
</style>

<!-- ================= SCRIPTS ================= -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/trumbowyg@2.25.1/dist/ui/trumbowyg.min.css">
<script src="https://cdn.jsdelivr.net/npm/trumbowyg@2.25.1/dist/trumbowyg.min.js"></script>

<script>
$(document).ready(function () {

  let pageCount = 1;

  function initEditor($editor) {
    $editor.trumbowyg({
      btns: [
        ['bold', 'italic', 'underline'],
        ['unorderedList', 'orderedList'],
        ['indent', 'outdent'],
        ['link'],
        ['undo', 'redo']
      ]
    });
  }

  // Initialize first editor
  initEditor($('.page-editor').first());

  // Add new page
  $('#addPageBtn').click(function () {

    pageCount++;

    let newPage = `
      <div class="page-wrapper border p-4 rounded-lg mb-6">
        <h4 class="font-semibold mb-3">Page #${pageCount}</h4>

        <input type="hidden" name="page_order[]" value="${pageCount}">

        <div class="mb-3">
          <label class="font-semibold">Heading</label>
          <input name="heading[]" class="kt-input">
        </div>

        <div class="flex flex-col">
          <label class="font-semibold">Paragraph</label>
          <textarea class="page-editor"
                    name="paragraph[]"></textarea>
        </div>
      </div>
    `;

    $('#pagesContainer').append(newPage);

    let $newEditor = $('.page-editor').last();
    initEditor($newEditor);
  });

});
</script>
