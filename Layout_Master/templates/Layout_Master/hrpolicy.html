<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Diary Notebook</title>

<style>
/* ---------- RESET ---------- */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #e6e6e6;
  font-family: "Cormorant Garamond", serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* ---------- NOTEBOOK ---------- */
.notebook {
  position: relative;
  width: 520px;
  height: 620px;
  perspective: 1800px;
}

/* ---------- PAGES ---------- */
.pages {
  width: 100%;
  height: 100%;
  position: relative;
}

.page {
  position: absolute;
  inset: 0;
  background: #ffffff;               /* ✅ Plain paper */
  padding: 40px;
  transform-origin: left center;
  transition: 
    transform 0.9s ease,
    box-shadow 0.4s ease;
  backface-visibility: hidden;
  box-shadow: 
    inset 0 0 0 1px #ddd,
    0 8px 20px rgba(0,0,0,0.15);
  overflow-y: auto;
}

/* Cover */
.cover {
  background: #2a2935;
  color: #fff;
  text-align: center;
}
.cover h1 {
  margin-top: 220px;
  font-size: 3rem;
}

/* Blank page (still white) */
.blank {
  background: #fff;
}

/* Page depth stacking */
.page:nth-child(1) { z-index: 5; }
.page:nth-child(2) { z-index: 4; }
.page:nth-child(3) { z-index: 3; }
.page:nth-child(4) { z-index: 2; }
.page:nth-child(5) { z-index: 1; }

/* Lift effect while flipping */
.page.flipped {
  transform: rotateY(-180deg);
  box-shadow: 
    -10px 10px 30px rgba(0,0,0,0.25);
}

/* ---------- CONTROLS ---------- */
.controls {
  position: absolute;
  bottom: -65px;                 /* ✅ OUTSIDE diary */
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 0 40px;
  z-index: 999;                  /* ✅ ALWAYS ON TOP */
}

button {
  background: #2a2935;
  color: #fff;
  border: none;
  padding: 10px 20px;
  font-size: 14px;
  cursor: pointer;
  border-radius: 5px;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

button:hover {
  transform: translateY(-2px);
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
</style>
</head>

<body>

<div class="notebook">
  <div class="pages">

    <!-- PAGE 1 -->
    <div class="page cover">
      <h1>My Diary</h1>
      <p>Personal Notes</p>
    </div>

    <!-- PAGE 2 -->
    <div class="page">
      <h2>Day 1</h2>
      <p>
        Today I started writing my diary.  
        It feels calm and peaceful.
      </p>
    </div>

    <!-- PAGE 3 (BLANK) -->
    <div class="page blank"></div>

    <!-- PAGE 4 -->
    <div class="page">
      <h2>Thoughts</h2>
      <p>
        Writing helps me slow down and reflect.
      </p>
    </div>

    <!-- PAGE 5 (BLANK) -->
    <div class="page blank"></div>



  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button id="prev">◀ Previous</button>
    <button id="next">Next ▶</button>
  </div>
</div>

<script>
let current = 0;
const pages = document.querySelectorAll(".page");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

function updateButtons() {
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === pages.length;
}

nextBtn.addEventListener("click", () => {
  if (current < pages.length) {
    pages[current].classList.add("flipped");
    current++;
    updateButtons();
  }
});

prevBtn.addEventListener("click", () => {
  if (current > 0) {
    current--;
    pages[current].classList.remove("flipped");
    updateButtons();
  }
});

updateButtons();
</script>

</body>
</html>
