{% load static %}
{% include 'Layout_Master/base.html' %}

<style>
    .process-menu,
    .user-menu {
        position: fixed !important;
        z-index: 99999 !important;
        background: white !important;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
        max-height: 350px;
        overflow-y: auto;
        overflow-x: hidden;
    }

    .process-dropdown,
    .user-dropdown {
        position: relative;
    }

    .process-menu.hidden,
    .user-menu.hidden {
        display: none !important;
    }

    .process-menu label,
    .user-menu label {
        position: relative;
        z-index: 100000;
        background: white;
    }
</style>

<div class="kt-wrapper flex grow flex-col">
    <table class="kt-table table-fixed kt-table-border w-full" data-kt-datatable-table="true"></table>
  <main class="grow pt-5" id="content" role="main">

    <!-- Page Header -->
    <div class="kt-container-fixed">

      <div class="flex flex-wrap items-center justify-between gap-5 pb-7.5">

        <div class="flex flex-col justify-center gap-2">

          <h1 class="text-xl font-medium leading-none text-mono">
            Password Vault
          </h1>

          <span class="text-sm text-secondary-foreground">
            Add New Password
          </span>

        </div>

        <a
          href="{% url 'passwordvault:vault_list' %}"
          class="kt-btn kt-btn-outline">
          Back to List
        </a>

      </div>

    </div>


    <!-- Main Container -->
    <div class="kt-container-fixed">

      <div class="kt-card w-full p-6 border rounded-xl bg-white shadow">

        <form
          method="post"
          action="{% url 'passwordvault:vault_add' %}"
          id="passwordVaultForm">

          {% csrf_token %}


          <!-- ================================================= -->
          <!-- BASIC PASSWORD DETAILS -->
          <!-- ================================================= -->

          <div class="kt-card w-full p-6 border rounded-xl bg-white shadow mb-6">

            <h3 class="kt-card-title mb-5">
              Password Details
            </h3>

            <div class="grid gap-6">


              <!-- Portal + URL -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>

                  <label class="font-semibold">
                    Portal / Application Name
                  </label>

                  <input
                    type="text"
                    name="name"
                    class="kt-input w-full"
                    required>

                </div>


                <div>

                  <label class="font-semibold">
                    URL / Remote Login
                  </label>

                  <input
                    type="text"
                    name="url"
                    class="kt-input w-full"
                    placeholder="https://example.com / ftp://server / 192.168.1.10">

                </div>

              </div>


              <!-- Username + Email -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>

                  <label class="font-semibold">
                    Username
                  </label>

                  <input
                    type="text"
                    name="username"
                    class="kt-input w-full"
                    required>

                </div>


                <div>

                  <label class="font-semibold">
                    Email ID
                  </label>

                  <input
                    type="email"
                    name="email_id"
                    class="kt-input w-full"
                    placeholder="user@example.com">

                </div>

              </div>


              <!-- Password + Recovery Code -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>

                  <label class="font-semibold">
                    Password
                  </label>

                  <div class="kt-input-group">

                    <input
                      type="password"
                      name="password"
                      id="vaultPassword"
                      class="kt-input w-full"
                      required>

                    <span
                      class="kt-input-group-text cursor-pointer"
                      onclick="togglePassword()">

                      👁

                    </span>

                  </div>

                </div>


                <div>

                  <label class="font-semibold">
                    Recovery Code
                  </label>

                  <input
                    type="text"
                    name="recovery_code"
                    class="kt-input w-full"
                    placeholder="Recovery / Backup Code">

                </div>

              </div>


              <!-- Security Questions -->
              <div>

                <label class="font-semibold">
                  Security Questions
                </label>

                <textarea
                  name="security_questions"
                  class="kt-textarea w-full"
                  rows="4"
                  placeholder="Question: What is your first school?
Answer: ABC School

Question: What is your pet name?
Answer: Tommy"></textarea>

              </div>


              <!-- Notes -->
              <div>

                <label class="font-semibold">
                  Notes
                </label>

                <textarea
                  name="notes"
                  class="kt-textarea w-full"
                  rows="3"></textarea>

              </div>


            </div>

          </div>


          <!-- ================================================= -->
          <!-- PASSWORD ACCESS -->
          <!-- ================================================= -->

          <div class="kt-card w-full p-6 border rounded-xl bg-white shadow">

            <div class="flex items-center justify-between mb-4">

              <div>

                <h3 class="kt-card-title">
                  Password Access
                </h3>

                <span class="text-sm text-secondary-foreground">
                  Select project, processes, users and permission
                </span>

              </div>


              <button
                type="button"
                class="kt-btn kt-btn-light"
                onclick="addProjectRow()">

                + Add Access

              </button>

            </div>


            <!-- Access Table -->
            <div class="overflow-x-auto">

              <table class="kt-table kt-table-border w-full">

                <thead>

                  <tr>

                    <th class="w-[22%]">
                      Project
                    </th>

                    <th class="w-[28%]">
                      Processes
                    </th>

                    <th class="w-[28%]">
                      Users
                    </th>

                    <th class="w-[17%]">
                      Permission
                    </th>

                    <th class="w-[5%] text-center">
                      Action
                    </th>

                  </tr>

                </thead>


                <tbody id="projectTable">
                </tbody>

              </table>

            </div>


            <!-- Hidden Fields -->
            <div id="accessHiddenFields"></div>


            <!-- Form Actions -->
            <div class="flex gap-3 justify-end mt-6">

              <button
                type="submit"
                class="kt-btn kt-btn-primary">

                Save to Vault

              </button>


              <a
                href="{% url 'passwordvault:vault_list' %}"
                class="kt-btn kt-btn-light">

                Cancel

              </a>

            </div>

          </div>


        </form>

      </div>

    </div>

  </main>

</div>


<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<script>


// ==========================================================
// Password Visibility
// ==========================================================

function togglePassword() {

  const passwordInput =
    document.getElementById("vaultPassword");

  if (passwordInput.type === "password") {

    passwordInput.type = "text";

  } else {

    passwordInput.type = "password";

  }

}


// ==========================================================
// Security Groups Data
// ==========================================================

const securityGroups = [

  {% for group in security_groups %}

  {
    project: "{{ group.project|escapejs }}",
    process: "{{ group.process|escapejs }}",
    dn: "{{ group.distinguished_name|escapejs }}"
  },

  {% endfor %}

];


// ==========================================================
// Project Users Data
// ==========================================================

const projectUsers = {{ project_users|safe }};


// ==========================================================
// Get Projects
// ==========================================================

function getProjects() {

  return [
    ...new Set(
      securityGroups.map(group => group.project)
    )
  ].sort();

}


// ==========================================================
// Get Processes For Project
// ==========================================================

function getProcesses(project) {

  const uniqueProcesses = new Map();

  securityGroups
    .filter(group => group.project === project)
    .forEach(group => {

      if (!uniqueProcesses.has(group.process)) {

        uniqueProcesses.set(group.process, group);

      }

    });

  return [...uniqueProcesses.values()];

}


// ==========================================================
// Add Access Row
// ==========================================================

function addProjectRow() {

  const table =
    document.getElementById("projectTable");

  const row =
    document.createElement("tr");

  row.innerHTML = `

    <!-- PROJECT -->
    <td class="py-3 px-3 align-top">

      <select
        class="kt-select w-full project-select"
        onchange="loadProjectData(this)"
        required>

        <option value="">
          Select Project
        </option>

        ${getProjects().map(project => `

          <option value="${escapeHtml(project)}">
            ${escapeHtml(project)}
          </option>

        `).join("")}

      </select>

    </td>


    <!-- PROCESSES -->
    <td class="py-3 px-3 align-top">

      <div class="relative process-dropdown">

        <button
          type="button"
          class="kt-input w-full text-left flex items-center justify-between process-button"
          onclick="toggleDropdown(this, 'process-menu')">

          <span class="process-label text-gray-500">
            Select Processes
          </span>

          <span>
            ▼
          </span>

        </button>


        <div
          class="process-menu hidden absolute left-0 right-0 mt-1 bg-white border rounded-lg shadow-lg z-50 p-3">

          <div class="process-list text-sm">

            <span class="text-gray-400">
              Select a project first
            </span>

          </div>

        </div>

      </div>

    </td>


    <!-- USERS -->
    <td class="py-3 px-3 align-top">

      <div class="relative user-dropdown">

        <button
          type="button"
          class="kt-input w-full text-left flex items-center justify-between user-button"
          onclick="toggleDropdown(this, 'user-menu')">

          <span class="user-label text-gray-500">
            Select Users
          </span>

          <span>
            ▼
          </span>

        </button>


        <div
          class="user-menu hidden absolute left-0 right-0 mt-1 bg-white border rounded-lg shadow-lg z-50 p-3">

          <div class="user-list text-sm">

            <span class="text-gray-400">
              Select a project first
            </span>

          </div>

        </div>

      </div>

    </td>


    <!-- PERMISSION -->
    <td class="py-3 px-3 align-top">

      <select
        class="kt-select w-full permission-select"
        onchange="rebuildAccessFields()">

        {% for value, label in permissions %}

          <option value="{{ value }}">
            {{ label }}
          </option>

        {% endfor %}

      </select>

    </td>


    <!-- ACTION -->
    <td class="py-3 px-3 text-center align-top">

      <button
        type="button"
        class="kt-btn kt-btn-sm kt-btn-light"
        onclick="removeAccessRow(this)">

        ✕

      </button>

    </td>

  `;

  table.appendChild(row);

}


// ==========================================================
// Load Project Data
// ==========================================================

function loadProjectData(projectSelect) {

  const row =
    projectSelect.closest("tr");

  const project =
    projectSelect.value;

  loadProcesses(project, row);

  loadUsers(project, row);

}


// ==========================================================
// Load Processes
// ==========================================================

function loadProcesses(project, row) {

  const processList =
    row.querySelector(".process-list");

  const processLabel =
    row.querySelector(".process-label");

  processList.innerHTML = "";

  processLabel.textContent =
    "Select Processes";

  processLabel.classList.add("text-gray-500");


  if (!project) {

    processList.innerHTML = `

      <span class="text-gray-400">
        Select a project first
      </span>

    `;

    rebuildAccessFields();

    return;

  }


  const processes =
    getProcesses(project);


  if (!processes.length) {

    processList.innerHTML = `

      <span class="text-gray-400">
        No processes available
      </span>

    `;

    rebuildAccessFields();

    return;

  }


  processes.forEach(group => {

    const item =
      document.createElement("label");

    item.className =
      "flex items-center gap-2 px-2 py-2 rounded hover:bg-gray-100 cursor-pointer";


    item.innerHTML = `

      <input
        type="checkbox"
        class="process-checkbox"
        value="${escapeHtml(group.dn)}"
        data-process="${escapeHtml(group.process)}"
        onchange="updateProcessSelection(this)">

      <span>
        ${escapeHtml(group.process)}
      </span>

    `;

    processList.appendChild(item);

  });

}


// ==========================================================
// Load Users
// ==========================================================

function clearUsers(row) {
  const userList = row.querySelector(".user-list");
  const userLabel = row.querySelector(".user-label");

  userList.innerHTML = `
    <span class="text-gray-400">
      Select one or more processes first
    </span>
  `;

  userLabel.textContent = "Select Users";
  userLabel.classList.add("text-gray-500");
}

function updateProcessSelection(checkbox) {
  const row = checkbox.closest("tr");

  updateProcessLabel(checkbox);
  loadUsers(row);
  rebuildAccessFields();
}

// ==========================================================
// Load Users For Selected Processes
// ==========================================================

function loadUsers(row) {
  const userList = row.querySelector(".user-list");
  const userLabel = row.querySelector(".user-label");

  userList.innerHTML = "";
  userLabel.textContent = "Select Users";
  userLabel.classList.add("text-gray-500");

  const selectedProcesses = [
    ...row.querySelectorAll(".process-checkbox:checked")
  ];

  if (!selectedProcesses.length) {
    clearUsers(row);
    rebuildAccessFields();
    return;
  }

  const usersMap = new Map();

  selectedProcesses.forEach(processCheckbox => {
    const groupDn = processCheckbox.value;
    const users = projectUsers[groupDn] || [];

    users.forEach(user => {
      const userId = String(user.id);

      if (!usersMap.has(userId)) {
        usersMap.set(userId, user);
      }
    });
  });

  const users = [...usersMap.values()].sort((a, b) =>
    String(a.name).localeCompare(String(b.name))
  );

  if (!users.length) {
    userList.innerHTML = `
      <span class="text-gray-400">
        No active users available for selected processes
      </span>
    `;
    rebuildAccessFields();
    return;
  }

  // All Users Option
  const allItem = document.createElement("label");
  allItem.className =
    "flex items-center gap-2 px-2 py-2 cursor-pointer border-b mb-2 pb-2";

  allItem.innerHTML = `
    <input
      type="checkbox"
      class="all-users-checkbox"
      value="all"
      onchange="toggleAllUsers(this)">

    <strong>All Users</strong>
  `;

  userList.appendChild(allItem);

  // Individual Users
  users.forEach(user => {
    const item = document.createElement("label");
    item.className =
      "flex items-center gap-2 px-2 py-2 cursor-pointer";

    item.innerHTML = `
      <input
        type="checkbox"
        class="user-checkbox"
        value="${escapeHtml(user.id)}"
        data-username="${escapeHtml(user.name)}"
        onchange="updateUserLabel(this)">

      <span>${escapeHtml(user.name)}</span>
    `;

    userList.appendChild(item);
  });
}

// ==========================================================
// Dropdown Toggle
// ==========================================================

function toggleDropdown(button, menuClass) {

    const dropdown = button.closest(
        '.process-dropdown, .user-dropdown'
    );

    const menu = dropdown.querySelector('.' + menuClass);

    // Close all other dropdowns
    document.querySelectorAll(
        '.process-menu, .user-menu'
    ).forEach(item => {

        if (item !== menu) {
            item.classList.add('hidden');
        }

    });

    // Toggle current dropdown
    const isHidden = menu.classList.contains('hidden');

    if (!isHidden) {

        menu.classList.add('hidden');
        return;

    }

    // Show menu temporarily to calculate dimensions
    menu.classList.remove('hidden');

    const rect = button.getBoundingClientRect();

    const menuHeight = Math.min(
        menu.scrollHeight,
        350
    );

    const spaceBelow = window.innerHeight - rect.bottom;
    const spaceAbove = rect.top;

    let topPosition;

    // Open upward if insufficient space below
    if (spaceBelow < menuHeight && spaceAbove > menuHeight) {

        topPosition = rect.top - menuHeight;

    } else {

        topPosition = rect.bottom + 4;

    }

    // Position menu relative to viewport
    menu.style.position = 'fixed';
    menu.style.left = `${rect.left}px`;
    menu.style.top = `${topPosition}px`;
    menu.style.width = `${rect.width}px`;
    menu.style.zIndex = '99999';

}


// ==========================================================
// Process Label
// ==========================================================

function updateProcessLabel(checkbox) {

  const row =
    checkbox.closest("tr");

  const checkboxes =
    row.querySelectorAll(".process-checkbox:checked");

  const label =
    row.querySelector(".process-label");


  if (!checkboxes.length) {

    label.textContent =
      "Select Processes";

    label.classList.add("text-gray-500");

  } else {

    const names =
      [...checkboxes].map(
        checkbox => checkbox.dataset.process
      );


    if (names.length <= 2) {

      label.textContent =
        names.join(", ");

    } else {

      label.textContent =
        `${names.length} processes selected`;

    }

    label.classList.remove("text-gray-500");

  }


  rebuildAccessFields();

}


// ==========================================================
// Toggle All Users
// ==========================================================

function toggleAllUsers(checkbox) {

  const row =
    checkbox.closest("tr");


  row.querySelectorAll(".user-checkbox")
    .forEach(userCheckbox => {

      userCheckbox.checked = false;

    });


  const label =
    row.querySelector(".user-label");


  if (checkbox.checked) {

    label.textContent =
      "All Users";

    label.classList.remove("text-gray-500");

  } else {

    label.textContent =
      "Select Users";

    label.classList.add("text-gray-500");

  }


  rebuildAccessFields();

}


// ==========================================================
// Individual User Label
// ==========================================================

function updateUserLabel(checkbox) {

  const row =
    checkbox.closest("tr");


  const allUsers =
    row.querySelector(".all-users-checkbox");


  if (allUsers) {

    allUsers.checked = false;

  }


  const selectedUsers =
    row.querySelectorAll(".user-checkbox:checked");


  const label =
    row.querySelector(".user-label");


  if (!selectedUsers.length) {

    label.textContent =
      "Select Users";

    label.classList.add("text-gray-500");

  } else if (selectedUsers.length <= 2) {

    label.textContent =
      [...selectedUsers]
        .map(user => user.dataset.username)
        .join(", ");

    label.classList.remove("text-gray-500");

  } else {

    label.textContent =
      `${selectedUsers.length} users selected`;

    label.classList.remove("text-gray-500");

  }


  rebuildAccessFields();

}


// ==========================================================
// Rebuild Hidden Fields
// ==========================================================

function rebuildAccessFields() {

  const container =
    document.getElementById("accessHiddenFields");

  container.innerHTML = "";


  document.querySelectorAll("#projectTable tr")
    .forEach(row => {


      const permission =
        row.querySelector(".permission-select").value;


      // Selected Processes
      const processCheckboxes =
        row.querySelectorAll(".process-checkbox:checked");


      // Selected Users
      const allUsers =
        row.querySelector(".all-users-checkbox");


      const selectedUsers =
        row.querySelectorAll(".user-checkbox:checked");


      // Group / Process Access
      processCheckboxes.forEach(checkbox => {

        addHiddenField(
          container,
          "group_dn[]",
          checkbox.value
        );


        addHiddenField(
          container,
          "permission[]",
          permission
        );

      });


      // Individual User Access
      // All Users is handled by group access
      if (!allUsers || !allUsers.checked) {

        selectedUsers.forEach(checkbox => {

          addHiddenField(
            container,
            "user_id[]",
            checkbox.value
          );


          addHiddenField(
            container,
            "user_permission[]",
            permission
          );

        });

      }

    });

}


// ==========================================================
// Add Hidden Input
// ==========================================================

function addHiddenField(container, name, value) {

  const input =
    document.createElement("input");

  input.type =
    "hidden";

  input.name =
    name;

  input.value =
    value;

  container.appendChild(input);

}


// ==========================================================
// Remove Access Row
// ==========================================================

function removeAccessRow(button) {

  button.closest("tr").remove();

  rebuildAccessFields();

}


// ==========================================================
// Escape HTML
// ==========================================================

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


// ==========================================================
// Close Dropdowns Outside
// ==========================================================

document.addEventListener("click", function(event) {

  if (
    !event.target.closest(".process-dropdown") &&
    !event.target.closest(".user-dropdown")
  ) {

    document.querySelectorAll(".process-menu, .user-menu")
      .forEach(menu => {

        menu.classList.add("hidden");

      });

  }

});


// ==========================================================
// Before Submit
// ==========================================================

document.getElementById("passwordVaultForm")
  .addEventListener("submit", function() {

    rebuildAccessFields();

  });


</script>
