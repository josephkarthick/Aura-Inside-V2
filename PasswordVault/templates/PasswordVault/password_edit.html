{% load static %}
{% include 'Layout_Master/base.html' %}
<style>
    .process-menu,
    .user-menu {
        position: fixed !important;
        z-index: 99999 !important;
        background: white !important;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
        max-height: 350px;
        overflow-y: auto;
        overflow-x: hidden;
    }

    .process-dropdown,
    .user-dropdown {
        position: relative;
    }

    .process-menu.hidden,
    .user-menu.hidden {
        display: none !important;
    }

    .process-menu label,
    .user-menu label {
        position: relative;
        z-index: 100000;
        background: white;
    }
</style>

<div class="kt-wrapper flex grow flex-col">
  <main class="grow pt-5" id="content" role="main">
    <table class="kt-table table-fixed kt-table-border w-full" data-kt-datatable-table="true"></table>

    <div class="kt-container-fixed">
      <div class="flex flex-wrap items-center lg:items-end justify-between gap-5 pb-7.5">
        <div class="flex flex-col justify-center gap-2">
          <h1 class="text-xl font-medium leading-none text-mono">Password Vault</h1>
          <span class="text-sm text-secondary-foreground">Edit Password</span>
        </div>
        <a href="{% url 'passwordvault:vault_list' %}" class="kt-btn kt-btn-outline">Back to List</a>
      </div>
    </div>

    <div class="kt-card-content">
      <div class="kt-card w-full p-6 border rounded-xl bg-white shadow">
        <form method="post" action="{% url 'passwordvault:vault_edit' entry.id %}" id="passwordVaultForm">
          {% csrf_token %}

          <div class="kt-card w-full p-6 border rounded-xl bg-white shadow mb-6">
            <div class="grid gap-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                  <label class="font-semibold">Portal / Application Name</label>
                  <input type="text" name="name" class="kt-input w-full" value="{{ entry.name }}" required>
                </div>
                <div>
                  <label class="font-semibold">Portal URL</label>
                  <input type="url" name="url" class="kt-input w-full" value="{{ entry.url|default:'' }}">
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                  <label class="font-semibold">Username / Email</label>
                  <input type="text" name="username" class="kt-input w-full" value="{{ entry.username }}" required>
                </div>
                <div>
                  <label class="font-semibold">Email ID</label>
                  <input type="email" name="email_id" class="kt-input w-full" value="{{ entry.email_id|default:'' }}">
                </div>
              </div>

              <div>
                <label class="font-semibold">Password</label>
                <div class="kt-input-group">
                  <input type="password" name="password" id="vaultPassword" class="kt-input w-full" placeholder="Leave blank to keep existing password">
                  <span class="kt-input-group-text cursor-pointer" onclick="togglePassword()">👁</span>
                </div>
              </div>

              <div>
                <label class="font-semibold">Recovery Code</label>
                <input type="text" name="recovery_code" class="kt-input w-full" value="{{ entry.recovery_code|default:'' }}">
              </div>

              <div>
                <label class="font-semibold">Security Questions</label>
                <textarea name="security_questions" class="kt-textarea w-full" rows="4">{{ entry.security_questions|default:'' }}</textarea>
              </div>

              <div>
                <label class="font-semibold">Notes</label>
                <textarea name="notes" class="kt-textarea w-full" rows="3">{{ entry.notes|default:'' }}</textarea>
              </div>
            </div>
          </div>

          <div class="kt-card w-full p-6 border rounded-xl bg-white shadow">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="kt-card-title">Password Access</h3>
                <span class="text-sm text-secondary-foreground">Select project, processes, users and permission</span>
              </div>
              <button type="button" class="kt-btn kt-btn-light" onclick="addProjectRow()">+ Add Access</button>
            </div>

            <div class="overflow-x-auto">
              <table class="kt-table kt-table-border w-full">
                <thead>
                  <tr>
                    <th class="w-[22%]">Project</th>
                    <th class="w-[25%]">Processes</th>
                    <th class="w-[25%]">Users</th>
                    <th class="w-[18%]">Permission</th>
                    <th class="w-[10%] text-center">Action</th>
                  </tr>
                </thead>
                <tbody id="projectTable"></tbody>
              </table>
            </div>

            <div id="accessHiddenFields"></div>

            <div class="flex gap-3 justify-end mt-6">
              <button type="submit" class="kt-btn kt-btn-primary">Update Password</button>
              <a href="{% url 'passwordvault:vault_list' %}" class="kt-btn kt-btn-light">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script>
function togglePassword() {
  const input = document.getElementById('vaultPassword');
  input.type = input.type === 'password' ? 'text' : 'password';
}

const securityGroups = [
  {% for project, processes in projects.items %}
    {% for item in processes %}
      {
        project: "{{ project|escapejs }}",
        process: "{{ item.process|escapejs }}",
        group_dn: "{{ item.group_dn|escapejs }}"
      },
    {% endfor %}
  {% endfor %}
];

const projectUsers = {{ project_users|safe }};

const existingAccess = [
  {% for access in existing_access %}
    {
      project: "{{ access.project|escapejs }}",
      process: "{{ access.process|escapejs }}",
      group_dn: "{{ access.group_dn|escapejs }}",
      permission: "{{ access.permission|escapejs }}"
    },
  {% endfor %}
];

const existingUserAccess = [

    {% for access in existing_user_access %}

    {
        user_id: "{{ access.user_id }}",

        username: "{{ access.username|escapejs }}",

        group_dn: "{{ access.group_dn|escapejs }}",

        permission: "{{ access.permission|escapejs }}"
    },

    {% endfor %}

];

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function addHiddenField(container, name, value) {
  const input = document.createElement('input');
  input.type = 'hidden'; input.name = name; input.value = value;
  container.appendChild(input);
}

function getProjects() {
  return [...new Set(securityGroups.map(g => g.project).filter(Boolean))].sort();
}

function getProcesses(project) {
  const seen = new Set();
  return securityGroups.filter(g => {
    if (g.project !== project || seen.has(g.process)) return false;
    seen.add(g.process); return true;
  });
}

function addProjectRow(selectedProject = '', selectedProcesses = [], selectedPermission = '', selectedUsers = [], allUsersSelected = false) {
  const row = document.createElement('tr');
  row.className = 'project-access-row';
  row.innerHTML = `
    <td class="py-3 px-3 align-top">
      <select class="kt-select w-full project-select" required>
        <option value="">Select Project</option>
        ${getProjects().map(p => `<option value="${escapeHtml(p)}" ${p === selectedProject ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}
      </select>
    </td>
    <td class="py-3 px-3 align-top">
      <div class="relative process-dropdown">
        <button type="button" class="kt-input w-full text-left flex items-center justify-between" onclick="toggleDropdown(this, 'process-menu')">
          <span class="process-label text-gray-500">Select Processes</span><span>▼</span>
        </button>
        <div class="process-menu hidden absolute left-0 right-0 mt-1 bg-white border rounded-lg shadow-lg z-50 p-3">
          <div class="process-list text-sm"><span class="text-gray-400">Select a project first</span></div>
        </div>
      </div>
    </td>
    <td class="py-3 px-3 align-top">
      <div class="relative user-dropdown">
        <button type="button" class="kt-input w-full text-left flex items-center justify-between" onclick="toggleDropdown(this, 'user-menu')">
          <span class="user-label text-gray-500">Select Users</span><span>▼</span>
        </button>
        <div class="user-menu hidden absolute left-0 right-0 mt-1 bg-white border rounded-lg shadow-lg z-50 p-3">
          <div class="user-list text-sm"><span class="text-gray-400">Select a process first</span></div>
        </div>
      </div>
    </td>
    <td class="py-3 px-3 align-top">
      <select class="kt-select w-full permission-select" required>
        {% for value, label in permissions %}
          <option value="{{ value }}" ${selectedPermission === '{{ value }}' ? 'selected' : ''}>{{ label }}</option>
        {% endfor %}
      </select>
    </td>
    <td class="py-3 px-3 text-center align-top">
      <button type="button" class="kt-btn kt-btn-sm kt-btn-light" onclick="this.closest('tr').remove(); rebuildAccessFields();">✕</button>
    </td>`;

  document.getElementById('projectTable').appendChild(row);
  setupProjectRow(row, selectedProcesses, selectedUsers, allUsersSelected);
}

function setupProjectRow(row, selectedProcesses = [], selectedUsers = [], allUsersSelected = false) {
  const projectSelect = row.querySelector('.project-select');
  populateProcesses(row, projectSelect.value, selectedProcesses);
  loadUsers(row, selectedUsers, allUsersSelected);

  projectSelect.addEventListener('change', function() {
    populateProcesses(row, this.value, []);
    clearUsers(row);
    rebuildAccessFields();
  });
}

function populateProcesses(row, project, selectedProcesses = []) {
  const list = row.querySelector('.process-list');
  list.innerHTML = '';
  row.querySelector('.process-label').textContent = 'Select Processes';

  if (!project) {
    list.innerHTML = '<span class="text-gray-400">Select a project first</span>';
    return;
  }

  const processes = getProcesses(project);
  if (!processes.length) {
    list.innerHTML = '<span class="text-gray-400">No processes available</span>';
    return;
  }

  processes.forEach(group => {
    const checked = selectedProcesses.includes(group.process) || selectedProcesses.includes(group.group_dn);
    const item = document.createElement('label');
    item.className = 'flex items-center gap-2 px-2 py-2 rounded hover:bg-gray-100 cursor-pointer';
    item.innerHTML = `<input type="checkbox" class="process-checkbox" value="${escapeHtml(group.group_dn)}" data-process="${escapeHtml(group.process)}" ${checked ? 'checked' : ''}><span>${escapeHtml(group.process)}</span>`;
    item.querySelector('input').addEventListener('change', function() {
      updateProcessLabel(row); loadUsers(row); rebuildAccessFields();
    });
    list.appendChild(item);
  });
  updateProcessLabel(row);
}

function loadUsers(row, selectedUsers = [], allUsersSelected = false) {
  const list = row.querySelector('.user-list');
  const label = row.querySelector('.user-label');
  const selectedIds = new Set(selectedUsers.map(String));
  list.innerHTML = ''; label.textContent = 'Select Users'; label.classList.add('text-gray-500');

  const selectedProcesses = [...row.querySelectorAll('.process-checkbox:checked')];
  if (!selectedProcesses.length) {
    list.innerHTML = '<span class="text-gray-400">Select a process first</span>'; return;
  }

  const usersMap = new Map();
  selectedProcesses.forEach(check => {
    (projectUsers[check.value] || []).forEach(user => {
      if (!usersMap.has(String(user.id))) usersMap.set(String(user.id), user);
    });
  });

  const users = [...usersMap.values()].sort((a, b) => String(a.name).localeCompare(String(b.name)));
  if (!users.length) {
    list.innerHTML = '<span class="text-gray-400">No active users available</span>'; return;
  }

  const allItem = document.createElement('label');
  allItem.className = 'flex items-center gap-2 px-2 py-2 cursor-pointer border-b mb-2 pb-2';
  allItem.innerHTML = `<input type="checkbox" class="all-users-checkbox" ${allUsersSelected ? 'checked' : ''}><strong>All Users</strong>`;
  allItem.querySelector('input').addEventListener('change', function() { toggleAllUsers(this); });
  list.appendChild(allItem);

  users.forEach(user => {
    const item = document.createElement('label');
    item.className = 'flex items-center gap-2 px-2 py-2 cursor-pointer';
    item.innerHTML = `<input type="checkbox" class="user-checkbox" value="${escapeHtml(user.id)}" data-username="${escapeHtml(user.name)}" ${selectedIds.has(String(user.id)) ? 'checked' : ''}><span>${escapeHtml(user.name)}</span>`;
    item.querySelector('input').addEventListener('change', function() { updateUserLabel(row); rebuildAccessFields(); });
    list.appendChild(item);
  });

  updateUserLabel(row);
  if (allUsersSelected) { label.textContent = 'All Users'; label.classList.remove('text-gray-500'); }
}

function clearUsers(row) {
  row.querySelector('.user-list').innerHTML = '<span class="text-gray-400">Select a process first</span>';
  row.querySelector('.user-label').textContent = 'Select Users';
}

function updateProcessLabel(row) {
  const selected = row.querySelectorAll('.process-checkbox:checked');
  const label = row.querySelector('.process-label');
  if (!selected.length) { label.textContent = 'Select Processes'; label.classList.add('text-gray-500'); return; }
  const names = [...selected].map(c => c.dataset.process);
  label.textContent = names.length <= 2 ? names.join(', ') : `${names.length} processes selected`;
  label.classList.remove('text-gray-500');
}

function updateUserLabel(row) {
  const all = row.querySelector('.all-users-checkbox');
  const selected = row.querySelectorAll('.user-checkbox:checked');
  const label = row.querySelector('.user-label');
  if (all && all.checked) { label.textContent = 'All Users'; label.classList.remove('text-gray-500'); return; }
  if (!selected.length) { label.textContent = 'Select Users'; label.classList.add('text-gray-500'); }
  else if (selected.length <= 2) { label.textContent = [...selected].map(c => c.dataset.username).join(', '); label.classList.remove('text-gray-500'); }
  else { label.textContent = `${selected.length} users selected`; label.classList.remove('text-gray-500'); }
}

function toggleAllUsers(checkbox) {
  const row = checkbox.closest('tr');
  row.querySelectorAll('.user-checkbox').forEach(c => c.checked = false);
  updateUserLabel(row); rebuildAccessFields();
}

function toggleDropdown(button, menuClass) {

    const dropdown = button.closest(
        '.process-dropdown, .user-dropdown'
    );

    const menu = dropdown.querySelector('.' + menuClass);

    // Close all other dropdowns
    document.querySelectorAll(
        '.process-menu, .user-menu'
    ).forEach(item => {

        if (item !== menu) {
            item.classList.add('hidden');
        }

    });

    // Toggle current dropdown
    const isHidden = menu.classList.contains('hidden');

    if (!isHidden) {

        menu.classList.add('hidden');
        return;

    }

    // Show menu temporarily to calculate dimensions
    menu.classList.remove('hidden');

    const rect = button.getBoundingClientRect();

    const menuHeight = Math.min(
        menu.scrollHeight,
        350
    );

    const spaceBelow = window.innerHeight - rect.bottom;
    const spaceAbove = rect.top;

    let topPosition;

    // Open upward if insufficient space below
    if (spaceBelow < menuHeight && spaceAbove > menuHeight) {

        topPosition = rect.top - menuHeight;

    } else {

        topPosition = rect.bottom + 4;

    }

    // Position menu relative to viewport
    menu.style.position = 'fixed';
    menu.style.left = `${rect.left}px`;
    menu.style.top = `${topPosition}px`;
    menu.style.width = `${rect.width}px`;
    menu.style.zIndex = '99999';

}

document.addEventListener('click', function(event) {

    if (
        !event.target.closest('.process-dropdown') &&
        !event.target.closest('.user-dropdown')
    ) {

        document.querySelectorAll(
            '.process-menu, .user-menu'
        ).forEach(menu => {

            menu.classList.add('hidden');

        });

    }

});

function rebuildAccessFields() {

    const container = document.getElementById('accessHiddenFields');

    container.innerHTML = '';

    const groups = new Map();
    const users = new Map();

    document.querySelectorAll(
        '#projectTable .project-access-row'
    ).forEach(row => {

        const permission = row.querySelector(
            '.permission-select'
        ).value;

        const all = row.querySelector(
            '.all-users-checkbox'
        );

        const processes = [
            ...row.querySelectorAll(
                '.process-checkbox:checked'
            )
        ];

        const selectedUsers = [
            ...row.querySelectorAll(
                '.user-checkbox:checked'
            )
        ];

        // ==========================================
        // ALL USERS ACCESS
        // ==========================================

        if (all && all.checked) {

            processes.forEach(process => {

                groups.set(
                    process.value,
                    permission
                );

            });

        }

        // ==========================================
        // INDIVIDUAL USER ACCESS
        // ==========================================

        else {

            selectedUsers.forEach(userCheckbox => {

                const userId = userCheckbox.value;

                processes.forEach(process => {

                    const groupDn = process.value;

                    // Ensure user belongs to this process
                    const processUsers =
                        projectUsers[groupDn] || [];

                    const belongsToProcess =
                        processUsers.some(
                            user =>
                                String(user.id) ===
                                String(userId)
                        );

                    if (!belongsToProcess) {
                        return;
                    }

                    const key =
                        `${userId}|||${groupDn}`;

                    users.set(
                        key,
                        {
                            userId: userId,
                            groupDn: groupDn,
                            permission: permission
                        }
                    );

                });

            });

        }

    });

    // ==========================================
    // GROUP HIDDEN FIELDS
    // ==========================================

    groups.forEach((permission, groupDn) => {

        addHiddenField(
            container,
            'group_dn[]',
            groupDn
        );

        addHiddenField(
            container,
            'permission[]',
            permission
        );

    });

    // ==========================================
    // USER HIDDEN FIELDS
    // ==========================================

    users.forEach(access => {

        addHiddenField(
            container,
            'user_id[]',
            access.userId
        );

        addHiddenField(
            container,
            'user_group_dn[]',
            access.groupDn
        );

        addHiddenField(
            container,
            'user_permission[]',
            access.permission
        );

    });

}

function findUserLocation(userId) {
  for (const group of securityGroups) {
    if ((projectUsers[group.group_dn] || []).some(u => String(u.id) === String(userId))) {
      return { project: group.project, process: group.process };
    }
  }
  return { project: '', process: '' };
}

function loadExistingAccess() {

    const grouped = {};

    // ==========================================
    // EXISTING GROUP ACCESS
    // ==========================================

    existingAccess.forEach(access => {

        const key =
            `${access.project}|||${access.permission}`;

        if (!grouped[key]) {

            grouped[key] = {
                project: access.project,
                permission: access.permission,
                processes: []
            };

        }

        if (
            !grouped[key].processes.includes(
                access.process
            )
        ) {

            grouped[key].processes.push(
                access.process
            );

        }

    });

    Object.values(grouped).forEach(access => {

        addProjectRow(
            access.project,
            access.processes,
            access.permission,
            [],
            true
        );

    });

    // ==========================================
    // EXISTING INDIVIDUAL USER ACCESS
    // ==========================================

    existingUserAccess.forEach(access => {

        const group = securityGroups.find(
            item =>
                item.group_dn === access.group_dn
        );

        if (!group) {
            return;
        }

        addProjectRow(
            group.project,
            [group.process],
            access.permission,
            [String(access.user_id)],
            false
        );

    });

    if (
        !existingAccess.length &&
        !existingUserAccess.length
    ) {

        addProjectRow();

    }

    rebuildAccessFields();

}

document.getElementById('passwordVaultForm').addEventListener('submit', function() {
  rebuildAccessFields();
});

document.addEventListener('DOMContentLoaded', loadExistingAccess);
</script>
