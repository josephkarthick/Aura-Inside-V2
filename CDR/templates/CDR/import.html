{% load static %}
{% include 'Layout_Master/base.html' %}

<div class="kt-wrapper flex grow flex-col">
<table class="kt-table table-fixed kt-table-border w-full" data-kt-datatable-table="true"></table>
    <main class="grow pt-5">

<div class="kt-card">

    <div class="kt-card-header">
        <h3 class="kt-card-title">
            Import Vendor CDR Files
        </h3>
    </div>

    <div class="kt-card-content">

        <form method="post" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- SIPLINK -->
                <div class="border rounded-lg p-5 bg-gray-50">

                    <div class="flex items-center justify-between mb-3">
                        <h4 class="kt-badge kt-badge-success">
                            SIPLINK
                        </h4>

                    </div>

                    <input
                        type="file"
                        class="kt-input"
                        name="siplink_file"
                        accept=".xlsx,.xls,.csv">

                </div>

                <!-- SKYFALL -->
                <div class="border rounded-lg p-5 bg-gray-50">

                    <div class="flex items-center justify-between mb-3">
                        <h4 class="kt-badge kt-badge-warning">
                            SKYFALL
                        </h4>
                    </div>

                    <input
                        type="file"
                        class="kt-input"
                        name="skyfall_file"
                        accept=".xlsx,.xls,.csv">

                </div>

                <!-- UNIFIED -->
                <div class="border rounded-lg p-5 bg-gray-50">

                    <div class="flex items-center justify-between mb-3">
                        <h4 class="kt-badge kt-badge-primary">
                            UNIFIED
                        </h4>
                    </div>

                    <input
                        type="file"
                        class="kt-input"
                        name="unified_file"
                        accept=".xlsx,.xls,.csv">

                </div>

                <!-- PULSE -->
                <div class="border rounded-lg p-5 bg-gray-50">

                    <div class="flex items-center justify-between mb-3">
                        <h4 class="kt-badge kt-badge-info">
                            PULSE
                        </h4>
                    </div>

                    <input
                        type="file"
                        class="kt-input"
                        name="pulse_file"
                        accept=".xlsx,.xls,.csv">

                </div>

            </div>

            <div class="text-end mt-6">

                <button class="kt-btn kt-btn-primary">
                    <i class="ki-filled ki-file-up"></i>
                    Import Files
                </button>

            </div>

        </form>

    </div>

</div>
